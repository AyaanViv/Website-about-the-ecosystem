        <div id="paragraphs">
            <p>The ecosystem needs us more now than ever and there is many ways you can get involved and help so please it would be much appreciated if you could sign up to our news letter</p>

        <div id="contact">
            <form>
                <label for="name">Prefered name:</label><br>
                <input type="text" id="name" name="name" placeholder="name"><br>
                <label for="email">Email:</label><br>
                <input type="text" id="email" name="email" placeholder="example@gmail.com"><br>
                <label for="consent">By pressing submit you agree to us sending you information regarding the ecosystem, such as our daily news letter and information regarding ways you can help.</label><br>
                <input type="checkbox" id="consent" name="consent"><br>
                <input type="submit" value="Submit">
            </form>
